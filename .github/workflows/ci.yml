name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      # `cargo run` rather than the binary path, so the .exe suffix on Windows is not a
      # shell problem.
      - name: Vertical slice
        shell: bash
        run: |
          set -euo pipefail
          kin() { cargo run --quiet -- "$@"; }
          kin new target/slice
          kin render --project target/slice --frame 30 -o target/slice/f30.png
          kin probe --project target/slice --at 1.0 > /dev/null
          kin check --project target/slice
          test -s target/slice/f30.png
